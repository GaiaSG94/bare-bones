<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Bare Bones : l'os du logo sur pastille encre, point d'articulation orange (thème Paper). -->
  <style>
    .bg { fill: #0B0D10; } .bone { fill: #F3F2EE; }
    @media (prefers-color-scheme: dark) { .bg { fill: #F3F2EE; } .bone { fill: #0B0D10; } }
  </style>
  <rect class="bg" width="64" height="64" rx="15"/>
  <g transform="translate(32 32) scale(1.45) translate(-16 -16)">
    <g class="bone" transform="rotate(-35 16 16)">
      <circle cx="7.4" cy="13.1" r="3.7"/><circle cx="7.4" cy="18.9" r="3.7"/>
      <circle cx="24.6" cy="13.1" r="3.7"/><circle cx="24.6" cy="18.9" r="3.7"/>
      <rect x="7.2" y="13.3" width="17.6" height="5.4" rx="2.7"/>
    </g>
    <circle cx="16" cy="16" r="2.1" fill="#E2621A"/>
  </g>
</svg>
